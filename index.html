<!DOCTYPE html>
<html>

<head>

<title>Direct Airways Fuel Planner</title>

<style>

body{
font-family: Arial;
background:#eef2f6;
margin:0;
}

header{
background:#2d4f77;
color:white;
padding:20px 40px;
display:flex;
align-items:center;
gap:20px;
}

header img{
height:55px;
max-width:220px;
object-fit:contain;
}

header h1{
margin:0;
font-weight:normal;
}

.container{
padding:40px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#2d4f77;
color:white;
padding:10px;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

td input{
width:100%;
padding:6px;
}

button{
background:#6db44a;
border:none;
color:white;
padding:12px 20px;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#5ca63d;
}

.output{
margin:40px;
background:#111;
color:#00ff9d;
padding:25px;
border-radius:10px;
font-family:monospace;
white-space:pre-wrap;
}

</style>

</head>

<body>

<header>

<img src="logo.jpg">

<h1>Direct Airways Fuel Planner</h1>

</header>

<div class="container">

<div class="card">

<h3>Route</h3>

<label>Route (comma separated ICAO)</label>

<input id="route" placeholder="EX. KDAB,KGMU,KPWK,KEYE,KGMU,KDAB">

<h3>Airport Data</h3>

<table id="airportTable">

<tr>
<th>ICAO</th>
<th>FBO</th>
<th>Fuel Price</th>
<th>Handling Fee</th>
<th>Waive Gal</th>
</tr>

<tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
<tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
<tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
<tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
<tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>

</table>

<br>

<button onclick="calculate()">Generate Fuel Plan</button>

</div>

<div class="card">

<h3>Instructions</h3>

<p>Enter route ICAOs and airport fuel information.</p>
<p>The planner will automatically calculate leg distances and estimated burn.</p>

</div>

</div>

<h3 style="margin-left:40px">Ops Ready Output</h3>

<div class="output" id="output"></div>

<script src="script.js"></script>

</body>

</html>
