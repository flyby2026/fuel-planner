<!DOCTYPE html>
<html>
<head>

<title>Aircraft Fuel Planner</title>

<style>

body{
font-family: Arial;
background:#f5f7fa;
margin:40px;
}

h1{
margin-bottom:20px;
}

.container{
display:flex;
gap:40px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
width:50%;
}

input{
padding:8px;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
}

button{
padding:12px 18px;
background:#0077ff;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

button:hover{
background:#005ed1;
}

pre{
background:#1e1e1e;
color:#00ff9d;
padding:20px;
border-radius:8px;
margin-top:20px;
white-space:pre-wrap;
}

</style>

</head>

<body>

<h1>Aircraft Fuel Planner</h1>

<div class="container">

<div class="box">

<h3>Route</h3>

<label>Route (comma separated ICAO codes)</label>

<input id="route" placeholder="EX. KDAB,KGMU,KPWK,KEYE,KGMU,KDAB">

<h3>Airport Data</h3>

<table id="airportTable">

<tr>
<th>ICAO</th>
<th>FBO</th>
<th>Fuel Price</th>
<th>Handling Fee</th>
<th>Waiver Gal</th>
</tr>

<tr>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
</tr>

<tr>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
</tr>

<tr>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
</tr>

<tr>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
</tr>

<tr>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
</tr>

</table>

<button onclick="calculate()">Generate Fuel Plan</button>

</div>

<div class="box">

<h3>How to Use</h3>

<p>1. Enter your route.</p>
<p>2. Fill out airport fuel information.</p>
<p>3. Click Generate Fuel Plan.</p>

<p>The planner will generate your ops-ready format.</p>

</div>

</div>

<h3>Ops Ready Output</h3>

<pre id="output"></pre>

<script src="script.js"></script>

</body>
</html>
